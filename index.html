<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>西游大冒险</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', sans-serif;
    background: radial-gradient(circle at 30% 20%, #2a3f5f, #0d1117 80%);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px; color: #fff;
  }
  .menu {
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .title { text-align: center; font-size: 2rem; font-weight: 900; color: #ffd700; text-shadow: 2px 2px 0 #8b6b3c; margin-bottom: 10px; }
  .card {
    background: linear-gradient(180deg, #fff8e7, #ffe9b8);
    border-radius: 24px; padding: 20px;
    border: 4px solid #ffd700; box-shadow: 0 8px 0 #b8860b;
    text-decoration: none; color: #2d1f0f;
    display: flex; align-items: center; gap: 16px;
    transition: transform 0.1s;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 4px 0 #b8860b; }
  .card .icon { font-size: 3rem; }
  .card h2 { font-size: 1.3rem; margin-bottom: 4px; }
  .card p { font-size: 0.8rem; color: #5a3e1b; line-height: 1.4; }
</style>
</head>
<body>

<div class="menu">
  <div class="title">🐵 西游大冒险</div>
  
  <a href="suan.html" class="card">
    <div class="icon">🧮</div>
    <div>
      <h2>速算小能手</h2>
      <p>60秒内挑战加减法，答对连击翻倍！</p>
    </div>
  </a>

  <a href="shizi.html" class="card">
    <div class="icon">📖</div>
    <div>
      <h2>识字大闯关</h2>
      <p>看拼音选汉字，认识生字还有笔顺提示。</p>
    </div>
  </a>
</div>

</body>
</html>
