  .topbar .sub { font-size:11px; opacity:0.85; margin-top:2px; }
  .score-box { background:rgba(255,255,255,0.25); border-radius:14px;
    padding:6px 14px; text-align:center; min-width:64px; }
  .score-box .num { font-size:22px; font-weight:800; }
  .score-box .lbl { font-size:10px; opacity:0.9; }
  .timer-box { background:rgba(255,255,255,0.25); border-radius:14px;
    padding:6px 14px; text-align:center; min-width:64px; margin-left:8px; }
  .timer-box .num { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .timer-box .lbl { font-size:10px; opacity:0.9; }
  .timer-box.urgent .num { color:#ffeb3b; animation:pulse 1s infinite; }

  .topbar-right { display:flex; }
  .progress-wrap { height:6px; background:#ffe0d6; }
  .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,#ffb74d,#ff7043);
    transition:width 0.4s; border-radius:0 3px 3px 0; }
  .main { padding:22px 22px 26px; min-height:460px; }

  .start-screen p { font-size:13px; color:#78909c; line-height:1.7; margin-bottom:20px; }
  .stage-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .stage-btn {

    padding:18px 8px; color:#fff; font-weight:700; transition:all 0.2s;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);

  .stage-btn:active { transform:scale(0.96); }
  .stage-btn .icon { font-size:26px; }
  .stage-btn .name { font-size:15px; }
  .stage-btn .count { font-size:11px; opacity:0.85; font-weight:400; }
  .stage-btn.s1 { background:linear-gradient(135deg,#42a5f5,#1e88e5); }
  .stage-btn.s2 { background:linear-gradient(135deg,#66bb6a,#43a047); }
  .stage-btn.s3 { background:linear-gradient(135deg,#ffa726,#fb8c00); }
  .stage-btn.s4 { background:linear-gradient(135deg,#ab47bc,#8e24aa); }
  .stage-btn:disabled { background:#cfd8dc !important; box-shadow:none; cursor:not-allowed; }
  .hint { font-size:12px; color:#b0bec5; margin-top:10px; }

  .btn { border:none; cursor:pointer; font-family:inherit; transition:all 0.2s; user-select:none; }
  .btn:active { transform:scale(0.96); }

  .stage-label { display:inline-block; font-size:12px; font-weight:700; color:#fff;
    padding:4px 12px; border-radius:20px; margin-bottom:6px; }
  .stage-1 { background:#42a5f5; } .stage-2 { background:#66bb6a; } .stage-3 { background:#ab47bc; }

  .question-title { font-size:15px; color:#546e7a; margin-bottom:6px; font-weight:600; }
  .question-title .big { font-size:40px; color:#263238; font-weight:800;
    display:inline-block; margin:0 4px; vertical-align:middle; }
  .pinyin-display { text-align:center; font-size:46px; font-weight:800; color:#e64a19;
    letter-spacing:2px; padding:18px 0 10px; font-family:"Times New Roman",serif;
    animation:fadeIn 0.4s; }
  .hanzi-display { text-align:center; font-size:64px; font-weight:800; color:#1a237e;
    padding:6px 0 14px; line-height:1.1; animation:fadeIn 0.4s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .options { display:grid; gap:12px; margin-top:18px; }
  .options.grid-3 { grid-template-columns:repeat(3,1fr); }
  .opt-btn { background:#f5f7fa; border:2px solid #e0e6ed; border-radius:16px;
    padding:18px 8px; font-size:22px; font-weight:700; color:#37474f; text-align:center;
    line-height:1.3; }
  .opt-btn.small { font-size:17px; padding:14px 6px; }

  .opt-btn.correct { background:#c8e6c9 !important; border-color:#4caf50 !important;
    color:#1b5e20 !important; animation:pop 0.3s; }
  .opt-btn.wrong { background:#ffcdd2 !important; border-color:#ef5350 !important;
    color:#b71c1c !important; animation:shake 0.4s; }
  .opt-btn.disabled { pointer-events:none; opacity:0.65; }
  .opt-btn.correct.disabled,.opt-btn.wrong.disabled { opacity:1; }

    border-radius:12px; padding:10px; opacity:0; transition:opacity 0.25s; }
  .feedback.show { opacity:1; }
  .feedback.ok { color:#2e7d32; background:#e8f5e9; }
  .feedback.no { color:#c62828; background:#ffebee; }
  .feedback .icon { font-size:22px; }
  .stroke-hint { margin-top:14px; background:#f3e5f5; border-left:4px solid #ab47bc;
    border-radius:10px; padding:12px 14px; font-size:14px; color:#4a148c;
    line-height:1.7; display:none; }
  .stroke-hint.show { display:block; animation:fadeIn 0.3s; }
  .stroke-hint b { color:#6a1b9a; }
  .next-wrap { text-align:center; margin-top:20px; }
  .btn-next { background:linear-gradient(135deg,#66bb6a,#43a047); color:#fff;
    font-size:16px; font-weight:700; padding:13px 42px; border-radius:50px;

  .result-screen .stars { font-size:30px; letter-spacing:6px; margin:6px 0 18px; }
  .result-screen .comment { font-size:15px; color:#546e7a; line-height:1.7; margin-bottom:24px; }

    .stage-btn { padding:14px 6px; }

/* ============================================================
   工具
   ============================================================ */
const ALL_STROKES = ['横','竖','撇','捺','点','提','横折','竖钩','弯钩','横折钩',
  '竖折','撇折','横撇','竖弯钩','斜钩','卧钩','横钩','竖提','横折弯钩','撇点','竖弯','竖折折钩','横折提'];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 从 strokeOrder 解析出笔画数组 */
function parseStrokes(strokeOrder) {
  return strokeOrder.split('、').map(s => s.trim()).filter(Boolean);
}

/* 构建题库：读音/拼音/总笔画选项自动补全；笔画题在每局中随机出题 */
function buildQuestions(coreWords) {
  const allPinyin = coreWords.map(w => w.pinyin);
  const allChars = coreWords.map(w => w.hanzi);
  return coreWords.map(w => {
    const otherChars = allChars.filter(c => c !== w.hanzi);
    const otherPinyin = allPinyin.filter(p => p !== w.pinyin);

    const readingOpts = shuffle([w.hanzi, ...shuffle(otherChars).slice(0, 2)]);
    const pinyinOpts = shuffle([w.pinyin, ...shuffle(otherPinyin).slice(0, 2)]);

    const totalSet = new Set([w.totalStrokes]);
    [w.totalStrokes-1, w.totalStrokes+1, w.totalStrokes-2, w.totalStrokes+2].forEach(c => {
      if (c > 0 && c <= 15 && totalSet.size < 3) totalSet.add(c);
    });
    const totalOpts = shuffle(Array.from(totalSet));

    return {
      hanzi: w.hanzi, pinyin: w.pinyin, totalStrokes: w.totalStrokes,
      strokeOrder: w.strokeOrder,
      strokes: parseStrokes(w.strokeOrder),  // 完整笔画列表
      readingOptions: readingOpts, readingAnswer: readingOpts.indexOf(w.hanzi),
      pinyinOptions: pinyinOpts, pinyinAnswer: pinyinOpts.indexOf(w.pinyin),
      totalOptions: totalOpts, totalAnswer: totalOpts.indexOf(w.totalStrokes)
    };
  });
}

  locked: false,
  timeLeft: GAME_SECONDS,

/* ============================================================

   ============================================================ */
function renderStart() {
  stopTimer();
  state.stageKey = null;
  state.finished = false;
  $subTitle.textContent = '选择学期开始';
  $timerNum.textContent = '5:00';
  $timerBox.classList.remove('urgent');
  updateScore(0);
  updateProgress(0);

  const keys = ['s1','s2','s3','s4'];
  const buttons = keys.map(k => {
    const s = STAGES[k];
    const n = s.core.length;
    const disabled = n === 0 ? 'disabled' : '';
    return `
      <button class="stage-btn ${s.color}" data-key="${k}" ${disabled}>
        <span class="icon">${s.icon}</span>
        <span class="name">${s.name}</span>
        <span class="count">${n} 个生字</span>
      </button>`;
  }).join('');

  $main.innerHTML = `
    <div class="start-screen">
      <div class="mascot">🐼</div>
      <h2>生字识字大闯关</h2>
      <p>每局 5 分钟，每个字 4 小问<br>听音辨字 → 选对拼音 → 总笔画 → 指定笔画</p>
      <div class="stage-grid">${buttons}</div>
      <div class="hint">选择学期后开始计时，时间到自动结算</div>
    </div>`;

  document.querySelectorAll('.stage-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      startGame(btn.dataset.key);
    });
  });
}

/* ============================================================
   开始
   ============================================================ */
function startGame(stageKey) {
  const s = STAGES[stageKey];
  state.stageKey = stageKey;
  state.questions = buildQuestions(s.core);
  state.order = shuffle(state.questions.map((_, i) => i));
  state.current = 0; state.step = 0; state.score = 0;
  state.locked = false; state.finished = false; state.timeUp = false;
  state.timeLeft = GAME_SECONDS;

  $subTitle.textContent = s.name + ' · 5分钟挑战';
  updateScore(0);
  updateProgress(0);
  updateTimerDisplay();
  $timerBox.classList.remove('urgent');
  startTimer();
  renderStep();
}

/* ============================================================
   计时器
   ============================================================ */
function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 30) $timerBox.classList.add('urgent');
    if (state.timeLeft <= 0) {
      stopTimer();
      state.timeUp = true;
      renderResult();
    }
  }, 1000);
}
function stopTimer() {
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}
function updateTimerDisplay() {
  const m = Math.floor(Math.max(0, state.timeLeft) / 60);
  const s = Math.max(0, state.timeLeft) % 60;
  $timerNum.textContent = `${m}:${String(s).padStart(2, '0')}`;
}

/* ============================================================
   答题
   ============================================================ */
function currentQuestion() { return state.questions[state.order[state.current]]; }

function qCounterHTML() {
  return `<span class="qcount">第 ${state.current + 1} / ${state.questions.length} 个字</span>`;
}

function renderStep() {
  if (state.finished) return;
  state.locked = false;
  const q = currentQuestion();
  const totalSteps = state.questions.length * 4;
  const doneSteps = state.current * 4 + state.step;
  updateProgress(doneSteps / totalSteps * 100);
  if (state.step === 0) renderReading(q);
  else if (state.step === 1) renderPinyin(q);
  else if (state.step === 2) renderTotal(q);
  else renderStroke(q);
}

    <div class="next-wrap"><button class="btn btn-next" id="btnNext">下一关 →</button></div>
    ${renderDots()}`;
  const $opts = document.getElementById('options');
  q.totalOptions.forEach((num, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn opt-btn small'; btn.textContent = num + ' 笔';
    btn.addEventListener('click', () => handleChoice(btn, i === q.totalAnswer, q, 'total'));
    $opts.appendChild(btn);
  });
}

/* ---- 第4小问：随机问某一笔 ---- */
function renderStroke(q) {
  const strokes = q.strokes;
  const idx = Math.floor(Math.random() * strokes.length); // 0-based
  const askName = strokes[idx];

  state.strokeAskIndex = idx;
  state.strokeAskName = askName;

  // 干扰项：从常用笔画池里抽2个不同于正确答案的
  const pool = ALL_STROKES.filter(s => s !== askName);
  const distractors = shuffle(pool).slice(0, 2);
  const opts = shuffle([askName, ...distractors]);
  state.strokeOptions = opts;
  state.strokeAnswer = opts.indexOf(askName);

  $main.innerHTML = `
    <div class="stage-label ${STAGE_CSS[2]}">${STAGE_NAMES[2]}</div>${qCounterHTML()}
    <div class="question-title">汉字 <span class="big">${q.hanzi}</span> 的第 <b>${idx + 1}</b> 笔是什么笔画？</div>
    <div class="options grid-3" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="stroke-hint" id="strokeHint"></div>
    <div class="next-wrap"><button class="btn btn-next" id="btnNext">下一题 →</button></div>
    ${renderDots()}`;

  const $opts = document.getElementById('options');
  opts.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn opt-btn small'; btn.textContent = text;
    btn.addEventListener('click', () => handleChoice(btn, i === state.strokeAnswer, q, 'stroke'));
    $opts.appendChild(btn);
  });
}

function handleChoice(btn, isRight, q, type) {
  if (state.locked || state.finished) return;
  state.locked = true;
  const $feedback = document.getElementById('feedback');
  const $hint = document.getElementById('strokeHint');
  const $next = document.getElementById('btnNext');
  document.querySelectorAll('#options .opt-btn').forEach(b => b.classList.add('disabled'));

  let correctText = '';
  let answerIdx = 0;

  if (type === 'reading') { correctText = q.hanzi; answerIdx = q.readingAnswer; }
  else if (type === 'pinyin') { correctText = q.pinyin; answerIdx = q.pinyinAnswer; }
  else if (type === 'total') { correctText = q.totalStrokes + ' 笔'; answerIdx = q.totalAnswer; }
  else { correctText = state.strokeAskName; answerIdx = state.strokeAnswer; }

  if (isRight) {
    btn.classList.add('correct');
    state.score++;
    updateScore(state.score);
    $feedback.className = 'feedback ok show';
    $feedback.innerHTML = '<span class="icon">✅</span> 答对啦！真棒！';
  } else {
    btn.classList.add('wrong');
    const allBtns = document.querySelectorAll('#options .opt-btn');
    if (allBtns[answerIdx]) allBtns[answerIdx].classList.add('correct');
    $feedback.className = 'feedback no show';
    $feedback.innerHTML = `<span class="icon">❌</span> 正确答案是「${correctText}」`;
  }

  if (type === 'total' || type === 'stroke' || !isRight) {
    $hint.classList.add('show');
    let hintHTML = `<b>笔顺：</b>${q.strokeOrder}<br><b>总笔画：</b>${q.totalStrokes} 笔`;
    if (type === 'stroke') {
      hintHTML += `<br><b>第${state.strokeAskIndex + 1}笔：</b>${state.strokeAskName}`;
    }
    $hint.innerHTML = hintHTML;
  }

  $next.classList.add('show');
  if (type === 'stroke') { $next.textContent = '下一个字 →'; $next.onclick = goNextChar; }
  else { $next.textContent = '下一关 →'; $next.onclick = goNextStep; }
}

function goNextStep() {
  if (state.finished) return;
  state.step++;
  if (state.step > 3) { goNextChar(); return; }
  renderStep();
}

function goNextChar() {
  if (state.finished) return;
  state.current++;
  state.step = 0;
  if (state.current >= state.questions.length) {
    stopTimer();
    renderResult();
  } else {
    renderStep();
  }
}

function renderDots() {
  let html = '<div class="dots">';
  const total = state.questions.length;
  for (let i = 0; i < total; i++) {
    let cls = 'dot';
    if (i < state.current) cls += ' done';
    if (i === state.current) cls += ' active';
    html += `<span class="${cls}"></span>`;
  }
  return html + '</div>';
}

function updateScore(n) { $scoreNum.textContent = n; }
function updateProgress(pct) { $progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%'; }

/* ============================================================
   结算
   ============================================================ */
function renderResult() {
  if (state.finished) return;
  state.finished = true;
  stopTimer();
  updateProgress(100);

  const score = state.score;
  const answeredChars = Math.min(state.current + (state.step > 0 ? 1 : 0), state.questions.length);
  const maxPossible = answeredChars * 4;
  const pct = maxPossible > 0 ? score / maxPossible : 0;

  let stars, comment, emoji;
  if (score === 0) { stars='⭐'; emoji='🌱'; comment='没关系，多读多写，下次一定会更好！'; }
  else if (pct >= 0.9) { stars='⭐⭐⭐⭐⭐'; emoji='🏆'; comment='太厉害了！生字识字小达人就是你！'; }
  else if (pct >= 0.75) { stars='⭐⭐⭐⭐'; emoji='🎉'; comment='真棒！继续加油，你离满分只差一点点！'; }
  else if (pct >= 0.5) { stars='⭐⭐⭐'; emoji='💪'; comment='不错哦！把答错的生字再复习一遍吧。'; }
  else { stars='⭐⭐'; emoji='🌱'; comment='没关系，多读多写，下次一定会更好！'; }

  const timeUpHTML = state.timeUp
    ? `<div class="timeup">⏰ 时间到！5 分钟挑战结束</div>`
    : `<div class="timeup">🎯 本阶段题目已全部完成</div>`;

  $main.innerHTML = `
    <div class="result-screen">
      <div class="trophy">${emoji}</div>
      <h2>闯关完成！</h2>
      ${timeUpHTML}
      <div class="final-score">${score} <span>分</span></div>
      <div class="stars">${stars}</div>
      <div class="comment">${comment}</div>
      <div>
        <button class="btn btn-restart" id="btnRestart">再玩一次 🔄</button>
        <button class="btn btn-home" id="btnHome">返回首页 🏠</button>
      </div>
    </div>`;

  document.getElementById('btnRestart').addEventListener('click', () => {
    if (state.stageKey) startGame(state.stageKey);
    else renderStart();
  });
  document.getElementById('btnHome').addEventListener('click', renderStart);

  if (pct >= 0.75 && score > 0) fireConfetti();
}

function fireConfetti() {
  const emojis = ['🎉','⭐','🌟','✨','🎊','💛','🧡'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

/* ============================================================
   启动
   ============================================================ */
renderStart();
</script>
</body>
</html>
