/* ================= 语音朗读模块 ================= */
let voiceUnlocked = false;
function unlockVoice() {
  if (voiceUnlocked || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0.01; u.lang = 'zh-CN';
    window.speechSynthesis.speak(u);
    voiceUnlocked = true;
  } catch (e) {}
}
function speak(text, onDone) {
  if (!text || !('speechSynthesis' in window)) { if (onDone) onDone(); return; }
  try {
    window.speechSynthesis.cancel();
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('zh'));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.0; u.pitch = 1.5;
    if (zhVoice) u.voice = zhVoice;
    let done = false;
    const finish = () => { if (!done) { done = true; if (onDone) onDone(); } };
    u.onend = finish; u.onerror = finish;
    setTimeout(finish, Math.max(1500, text.length * 250));
    window.speechSynthesis.speak(u);
  } catch (e) { if (onDone) onDone(); }
}

/* ================= 游戏状态 ================= */
let currentStageKey = null;
let questions = [];
let qIndex = 0;
let score = 0;
let correctCount = 0;
let totalTime = 300;
let timeLeft = 300;
let timerId = null;
let isAnswered = false;

const mainEl = document.getElementById('main');
const subTitle = document.getElementById('subTitle');
const scoreNum = document.getElementById('scoreNum');
const timerNum = document.getElementById('timerNum');
const timerBox = document.getElementById('timerBox');
const progressBar = document.getElementById('progressBar');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ================= 页面渲染 ================= */
function renderStartScreen() {
  clearInterval(timerId);
  subTitle.textContent = '选择学期开始';
  timerNum.textContent = '5:00';
  timerBox.classList.remove('urgent');
  scoreNum.textContent = '0';
  progressBar.style.width = '0%';

  let html = `
    <div class="start-screen">
      <div class="mascot">🐵</div>
      <h2>生字大闯关</h2>
      <p>选择一个学期，开始识字挑战！<br>听清悟空读题，选出正确的答案。</p>
      <div class="stage-grid">
  `;
  for (const key in STAGES) {
    const s = STAGES[key];
    html += `
      <button class="stage-btn ${s.color}" onclick="startGame('${key}')">
        <span class="icon">${s.icon}</span>
        <span class="name">${s.name}</span>
        <span class="count">${s.core.length} 个生字</span>
      </button>
    `;
  }
  html += `</div><div class="hint">点击按钮后，请允许浏览器播放声音哦~</div></div>`;
  mainEl.innerHTML = html;
  unlockVoice(); 
}

function startGame(stageKey) {
  currentStageKey = stageKey;
  const stageData = STAGES[stageKey];
  subTitle.textContent = stageData.name;
  
  // 生成题目 (打乱生字，每种类型出几道)
  const chars = shuffle([...stageData.core]);
  questions = chars.map((c, i) => {
    const type = i % 3; 
    let title = '', display = '', options = [], answer = '';
    
    if (type === 0) {
      title = '请选出正确的拼音：';
      display = `<div class="hanzi-display">${c.hanzi}</div>`;
      const allPinyins = [...new Set(stageData.core.map(x => x.pinyin))];
      let distractors = shuffle(allPinyins.filter(p => p !== c.pinyin)).slice(0, 2);
      options = shuffle([c.pinyin, ...distractors]);
      answer = c.pinyin;
    } else if (type === 1) {
      title = '请选出对应的生字：';
      display = `<div class="pinyin-display">${c.pinyin}</div>`;
      const allHanzis = [...new Set(stageData.core.map(x => x.hanzi))];
      let distractors = shuffle(allHanzis.filter(h => h !== c.hanzi)).slice(0, 2);
      options = shuffle([c.hanzi, ...distractors]);
      answer = c.hanzi;
    } else {
      title = '这个字一共有几笔？';
      display = `<div class="hanzi-display">${c.hanzi}</div>`;
      const correct = c.totalStrokes;
      const set = new Set([correct]);
      while(set.size < 3) {
        let d = correct + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random()*2)+1);
        if (d > 0) set.add(d);
      }
      options = shuffle([...set]).map(String);
      answer = String(correct);
    }
    
    return { type, hanzi: c.hanzi, pinyin: c.pinyin, strokeOrder: c.strokeOrder, title, display, options, answer };
  });

  score = 0; correctCount = 0; qIndex = 0; timeLeft = totalTime;
  scoreNum.textContent = '0';
  renderQuestion();
  startTimer();
}

function startTimer() {
  clearInterval(timerId);
  timerBox.classList.remove('urgent');
  updateTimerDisplay();
  timerId = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 30) timerBox.classList.add('urgent');
    if (timeLeft <= 0) endGame(true);
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timerNum.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
}

function renderQuestion() {
  if (qIndex >= questions.length) { endGame(false); return; }
  isAnswered = false;
  const q = questions[qIndex];
  progressBar.style.width = `${(qIndex / questions.length) * 100}%`;
  
  let html = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
      <span class="stage-label stage-${(qIndex%3)+1}">第 ${qIndex+1} 题</span>
      <span class="qcount">${qIndex+1} / ${questions.length}</span>
    </div>
    <div class="question-title">${q.title}</div>
    ${q.display}
    <div class="options grid-3" id="optionsContainer">
  `;
  
  q.options.forEach(opt => {
    const isSmall = opt.length > 1;
    html += `<button class="opt-btn ${isSmall ? 'small' : ''}" onclick="checkAnswer(this, '${opt}')">${opt}</button>`;
  });
  
  html += `
    </div>
    <div class="feedback" id="feedbackBox"><span class="icon"></span><span class="text"></span></div>
    <div class="stroke-hint" id="strokeHint">笔顺：<b>${q.strokeOrder}</b></div>
    <div class="next-wrap">
      <button class="btn btn-speak" id="btnSpeak" onclick="speakQuestion()">🔊 再听一次</button>
      <button class="btn btn-next" id="btnNext" onclick="nextQuestion()">下一题 ➜</button>
    </div>
    <div class="dots" id="dotsContainer"></div>
  `;
  
  mainEl.innerHTML = html;
  
  const dots = document.getElementById('dotsContainer');
  for(let i=0; i<questions.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < qIndex ? ' done' : (i === qIndex ? ' active' : ''));
    dots.appendChild(d);
  }
  
  // 题目出现后，延迟一点点自动朗读
  setTimeout(() => {
    document.getElementById('btnSpeak').classList.add('show');
    speakQuestion();
  }, 400);
}

function speakQuestion() {
  if(qIndex >= questions.length) return;
  const q = questions[qIndex];
  let textToSpeak = q.title;
  
  if (q.type === 0) {
    textToSpeak += `这个字，${q.hanzi}。`;
  } else if (q.type === 1) {
    textToSpeak += `这个拼音，${q.pinyin}。`;
  } else if (q.type === 2) {
    textToSpeak += `这个字。`;
  }
  
  speak(textToSpeak);
}

function checkAnswer(btn, selected) {
  if (isAnswered) return;
  isAnswered = true;
  
  const q = questions[qIndex];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.classList.add('disabled'));
  
  const fbBox = document.getElementById('feedbackBox');
  const fbIcon = fbBox.querySelector('.icon');
  const fbText = fbBox.querySelector('.text');
  
  if (selected === q.answer) {
    btn.classList.add('correct');
    score += 10; correctCount++;
    scoreNum.textContent = score;
    fbBox.className = 'feedback ok show';
    fbIcon.textContent = '✅';
    fbText.textContent = '答对啦，真棒！';
    speak('答对啦，真棒！');
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => {
      if (b.textContent === q.answer) b.classList.add('correct');
    });
    fbBox.className = 'feedback no show';
    fbIcon.textContent = '❌';
    fbText.textContent = `答错了，正确答案是 ${q.answer}`;
    speak(`答错了，正确答案是，${q.answer}`);
  }
  
  document.getElementById('strokeHint').classList.add('show');
  document.getElementById('btnNext').classList.add('show');
}

function nextQuestion() {
  qIndex++;
  renderQuestion();
}

function endGame(isTimeout) {
  clearInterval(timerId);
  progressBar.style.width = '100%';
  
  const total = questions.length;
  const rate = correctCount / total;
  let stars = '⭐';
  if (rate >= 0.9) stars = '⭐⭐⭐';
  else if (rate >= 0.6) stars = '⭐⭐';
  
  let comment = isTimeout ? '时间到啦，下次再快一点哦！' : '闯关结束，你太棒了！';
  speak(isTimeout ? '时间到啦！' : '闯关结束，你太棒了！');

  mainEl.innerHTML = `
    <div class="result-screen">
      <div class="trophy">${isTimeout ? '⏰' : '🏆'}</div>
      <h2>${isTimeout ? '时间到！' : '闯关成功！'}</h2>
      ${isTimeout ? '<div class="timeup">挑战已结束</div>' : ''}
      <div class="final-score">${score} <span>分</span></div>
      <div class="stars">${stars}</div>
      <div class="comment">${comment}<br>答对 ${correctCount} 题 / 共 ${total} 题</div>
      <div>
        <button class="btn btn-restart" onclick="startGame('${currentStageKey}')">再玩一次</button>
        <button class="btn btn-home" onclick="renderStartScreen()">选择学期</button>
      </div>
    </div>
  `;
}

// 初始化
window.onload = () => {
  renderStartScreen();
};
</script>
</body>
</html>
